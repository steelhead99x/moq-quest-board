<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1><span class="gem"></span>QUEST BOARD</h1>
  <div class="chips" id="viewChips" role="group" aria-label="View"></div>
  <select id="project" aria-label="Project"></select>
  <input id="q" type="search" placeholder="Search" title="Press / to search" size="16" aria-label="Search quests">
  <div class="chips" id="statusChips" role="group" aria-label="Status filter"></div>
  <span class="spacer"></span>
  <button id="projects">Projects</button>
  <button id="theme"></button>
  <button id="refresh" title="Reload every tree (R)">Refresh</button>
</header>
<div id="banners"></div>
<main id="board"></main>
<aside id="panel" aria-label="Quest details" inert></aside>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
